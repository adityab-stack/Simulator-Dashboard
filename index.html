<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snitch — Plan vs Actual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1210; --panel:#171B18; --panel-2:#1D2320; --line:#2A312C;
    --amber:#E8A33D; --amber-dim:#8A6326; --thread:#4F7C6B;
    --text:#EDEEE8; --text-dim:#9AA39B; --text-faint:#616B62;
    --red:#C1594A; --green:#6FA383;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:radial-gradient(1200px 600px at 10% -10%, #1A2019 0%, transparent 60%), var(--bg);
        color:var(--text); font-family:'Inter', sans-serif; min-height:100vh; }
  ::selection{ background:var(--amber); color:#111; }

  header{ padding:24px 32px 18px; border-bottom:1px solid var(--line);
          display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px; }
  .brand{ display:flex; align-items:baseline; gap:14px; }
  .brand .mark{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:24px; letter-spacing:-0.02em; }
  .brand .mark span{ color:var(--amber); }
  .brand .sub{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--text-dim); letter-spacing:0.04em; }
  .meta-stamp{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--text-faint); text-align:right; }
  .meta-stamp b{ color:var(--thread); }

  .filter-rail{ display:flex; flex-wrap:wrap; gap:10px; padding:16px 32px; background:var(--panel);
                border-bottom:1px solid var(--line); position:sticky; top:0; z-index:50; align-items:flex-end; }
  .filter-group{ display:flex; flex-direction:column; gap:4px; min-width:126px; }
  .filter-group label{ font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase;
                        letter-spacing:0.08em; color:var(--text-faint); }
  select{ background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:8px 10px;
          border-radius:6px; font-size:13px; font-family:'Inter'; outline:none; cursor:pointer; }
  select:focus{ border-color:var(--amber); }
  .reset-btn{ background:transparent; border:1px solid var(--amber-dim); color:var(--amber); padding:8px 16px;
              border-radius:6px; font-size:12px; cursor:pointer; font-family:'IBM Plex Mono', monospace; }
  .reset-btn:hover{ background:var(--amber); color:#111; }
  .toggle{ display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; margin-left:auto; }
  .toggle button{ background:var(--panel-2); border:none; color:var(--text-dim); padding:8px 18px; cursor:pointer;
                   font-family:'IBM Plex Mono', monospace; font-size:12px; }
  .toggle button.active{ background:var(--amber); color:#111; font-weight:600; }
  .active-path{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--thread);
                width:100%; padding-top:8px; }

  main{ padding:24px 32px 60px; max-width:1800px; margin:0 auto; }

  .kpi-row{ display:grid; grid-template-columns:repeat(5, 1fr); gap:12px; margin-bottom:30px; }
  @media(max-width:1000px){ .kpi-row{ grid-template-columns:repeat(2,1fr);} }
  .kpi{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; position:relative; overflow:hidden; }
  .kpi::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--amber-dim); }
  .kpi .label{ font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); }
  .kpi .value{ font-family:'Space Grotesk', sans-serif; font-size:24px; font-weight:600; margin-top:6px; }
  .kpi .sub{ font-size:11px; color:var(--text-dim); margin-top:4px; }

  .card-section{ margin-bottom:36px; }
  .card-section h2{ font-family:'Space Grotesk', sans-serif; font-size:15px; font-weight:600;
                     display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .card-section h2 .rule{ flex:1; height:1px; background:var(--line); }
  .card-section h2 .count{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--text-faint); font-weight:400; }
  .sort-select{ margin-left:12px; background:var(--panel-2); border:1px solid var(--line); color:var(--text-dim);
                font-family:'IBM Plex Mono', monospace; font-size:11px; padding:4px 8px; border-radius:5px; cursor:pointer; }

  .pivot-strip{ display:flex; gap:14px; overflow-x:auto; padding-bottom:10px; }
  .pivot-block{ background:var(--panel); border:1px solid var(--line); border-radius:10px;
                padding:12px 14px; flex:0 0 auto; min-width:300px; }
  .pivot-block h4{ font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase;
                    letter-spacing:0.06em; color:var(--text-faint); margin-bottom:8px; }
  .pivot-block h4.target-note{ color:var(--amber); }
  .ptable{ border-collapse:collapse; }
  .ptable th{ font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase;
              color:var(--text-faint); padding:5px 8px; text-align:right; font-weight:500;
              border-bottom:1px solid var(--line); }
  .ptable th:first-child{ text-align:left; min-width:90px; }
  .ptable td{ padding:5px 8px; font-family:'IBM Plex Mono', monospace; font-size:12px;
              text-align:right; color:var(--text-dim); border-bottom:1px solid #1B2019; white-space:nowrap; }
  .ptable td.rowlabel{ text-align:left; font-family:'Inter'; font-weight:500; color:var(--text); }
  .ptable td.dash{ color:var(--text-faint); }
  .ptable td.delta-behind{ color:var(--red); }
  .ptable td.delta-ahead{ color:var(--green); }
  .sortable-th{ cursor:pointer; user-select:none; }
  .sortable-th:hover{ color:var(--amber); }
  .total-row td{ font-weight:600; border-top:2px solid var(--line); background:var(--panel-2); color:var(--text); }
  .total-row td.total-label{ color:var(--amber); }
  .sort-hint{ font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--text-faint); font-weight:400; margin-left:8px; }

  .summary-card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:14px; }
  .summary-card h3{ font-family:'Space Grotesk', sans-serif; font-size:16px; color:var(--amber); margin-bottom:10px; }
  .summary-stats{ display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--text-dim); margin-bottom:12px; font-family:'IBM Plex Mono', monospace; }
  .summary-stats b{ color:var(--text); }
  .summary-list{ list-style:none; display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--text-dim); }
  .summary-list b{ color:var(--text); }
  .ptable td.doi-cell{ padding:3px 6px; }
  .doi-chip{ display:inline-block; width:100%; padding:3px 6px; border-radius:4px; text-align:right; font-size:11.5px; }
  .doi-healthy{ background:rgba(111,163,131,0.22); color:var(--green); }
  .doi-watch{ background:rgba(232,163,61,0.22); color:var(--amber); }
  .doi-stuck{ background:rgba(193,89,74,0.28); color:var(--red); }
  .doi-none{ color:var(--text-faint); background:transparent; }

  .empty-note{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--text-faint); padding:10px 0; }

  footer{ text-align:center; padding:24px; font-family:'IBM Plex Mono', monospace; font-size:11px;
          color:var(--text-faint); border-top:1px solid var(--line); }
  footer .warn{ color:var(--amber); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">SNITCH <span>/</span> PLAN VS ACTUAL</div>
    <div class="sub">MONTH-ON-MONTH &middot; AUG&ndash;DEC 2026</div>
  </div>
  <div class="meta-stamp" id="stamp">Data as of —</div>
</header>

<div class="filter-rail">
  <div class="filter-group"><label>Channel</label><select id="f-channel"><option value="ALL">All Channels</option></select></div>
  <div class="filter-group"><label>L1</label><select id="f-l1"><option value="ALL">All L1</option></select></div>
  <div class="filter-group"><label>Category</label><select id="f-cat"><option value="ALL">All Categories</option></select></div>
  <div class="filter-group"><label>Meta 1</label><select id="f-m1"><option value="ALL">All Meta1</option></select></div>
  <div class="filter-group"><label>Meta 2</label><select id="f-m2"><option value="ALL">All Meta2</option></select></div>
  <div class="filter-group"><label>Meta 3</label><select id="f-m3"><option value="ALL">All Meta3</option></select></div>
  <button class="reset-btn" id="reset">RESET</button>
  <div class="toggle" id="metric-toggle">
    <button data-metric="qty" class="active">QTY</button>
    <button data-metric="cogs">COGS ₹</button>
  </div>
  <div class="toggle" id="page-toggle" style="margin-left:8px;">
    <button data-page="dashboard" class="active">DASHBOARD</button>
    <button data-page="tracking">SALES TRACKING</button>
    <button data-page="summary">EXEC SUMMARY</button>
  </div>
  <div class="active-path" id="active-path"></div>
</div>

<main>
  <div class="kpi-row" id="kpi-row"></div>
  <div id="page-dashboard">
    <div id="cards-root"></div>
  </div>
  <div id="page-tracking" style="display:none;">
    <div id="tracking-root"></div>
  </div>
  <div id="page-summary" style="display:none;">
    <div id="summary-root"></div>
  </div>
</main>

<footer>
  Rebuilt from Google Sheets via <b style="color:var(--thread)">build_data.py</b> &middot; V1.2<br>
  <span class="warn">Target = new category files (jeans/shirts/trousers/tshirts) where covered, else old Targets tab (Shopify only). Plan Closing still "—" until that file arrives.</span>
</footer>

<script>
let DATA = null;
let leafIndex = {};        // leafKey -> sorted array of inventory records
let pipelineIndex = {};    // leafKey -> array of pipeline records
let allLeafKeysByLC = {};  // "l1||cat" -> [leafKeys...] across the WHOLE dataset (for proration denominator)
let metric = 'qty';
let currentPage = 'dashboard';

const MONTHS = ['2026-08','2026-09','2026-10','2026-11','2026-12'];
const PREV_MONTH = {'2026-08':'2026-07','2026-09':'2026-08','2026-10':'2026-09','2026-11':'2026-10','2026-12':'2026-11'};
const MONTH_LABEL = {'2026-06':'Jun','2026-07':'Jul','2026-08':'Aug','2026-09':'Sep','2026-10':'Oct','2026-11':'Nov','2026-12':'Dec'};
const CHANNEL_TO_INV_FIELD = {'Shopify':'online', 'Marketplace':'mp', 'Offline':'offline'};
const LAST_MONTH = MONTHS[MONTHS.length - 1];
const NEW_FILE_CATS = new Set(['jeans','shirts','trousers','tshirts']);

const CARD_DEFS = [
  {id:'l1',    title:'Break down by L1',                dims:['l1']},
  {id:'l1cat', title:'Break down by L1 × Category',      dims:['l1','cat']},
  {id:'cat',   title:'Break down by Category',           dims:['cat']},
  {id:'catm1', title:'Break down by Category × Meta1',   dims:['cat','m1']},
  {id:'m1',    title:'Break down by Meta1',              dims:['m1']},
  {id:'m2',    title:'Break down by Meta2',               dims:['m2']},
  {id:'m3',    title:'Break down by Meta3',               dims:['m3']},
];

function monthMinus(monthKey, n){
  const [y, m] = monthKey.split('-').map(Number);
  const d = new Date(Date.UTC(y, m - 1 - n, 1));
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth()+1).padStart(2,'0');
}
function currentMonthKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

fetch('data/data.json').then(r => r.json()).then(json => {
  DATA = json;
  document.getElementById('stamp').innerHTML = 'Data as of <b>' + new Date(json.generated_at).toLocaleString() + '</b>';
  buildIndexes();
  populateFilters();
  render();
});

function leafKeyOf(r){ return [r.l1, r.cat, r.m1, r.m2, r.m3].map(v => v ?? '∅').join('|'); }

function buildIndexes(){
  DATA.inventory.forEach(r => {
    const k = leafKeyOf(r);
    (leafIndex[k] = leafIndex[k] || []).push(r);
  });
  Object.values(leafIndex).forEach(arr => arr.sort((a,b) => a.date.localeCompare(b.date)));

  (DATA.pipeline || []).forEach(r => {
    const k = leafKeyOf(r);
    (pipelineIndex[k] = pipelineIndex[k] || []).push(r);
  });

  const allKeys = new Set([...Object.keys(leafIndex), ...Object.keys(pipelineIndex)]);
  allKeys.forEach(k => {
    const rec = (leafIndex[k] || pipelineIndex[k])[0];
    const lcKey = rec.l1 + '||' + rec.cat;
    (allLeafKeysByLC[lcKey] = allLeafKeysByLC[lcKey] || []).push(k);
  });
}

function uniq(arr, key){ return [...new Set(arr.map(x => x[key]).filter(Boolean))].sort(); }

function populateFilters(){
  const s = DATA.sales;
  fillSelect('f-channel', uniq(s,'channel'));
  fillSelect('f-l1', uniq(s,'l1'));
  fillSelect('f-cat', uniq(s,'cat'));
  fillSelect('f-m1', uniq(s,'m1'));
  fillSelect('f-m2', uniq(s,'m2'));
  fillSelect('f-m3', uniq(s,'m3'));
  ['f-channel','f-l1','f-cat','f-m1','f-m2','f-m3'].forEach(id =>
    document.getElementById(id).addEventListener('change', render));
  document.getElementById('reset').addEventListener('click', () => {
    ['f-channel','f-l1','f-cat','f-m1','f-m2','f-m3'].forEach(id => document.getElementById(id).value = 'ALL');
    render();
  });
  document.querySelectorAll('#metric-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#metric-toggle button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      metric = btn.dataset.metric;
      render();
    });
  });
  document.querySelectorAll('#page-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#page-toggle button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentPage = btn.dataset.page;
      document.getElementById('page-dashboard').style.display = currentPage === 'dashboard' ? '' : 'none';
      document.getElementById('page-tracking').style.display = currentPage === 'tracking' ? '' : 'none';
      document.getElementById('page-summary').style.display = currentPage === 'summary' ? '' : 'none';
      render();
    });
  });
}
function fillSelect(id, values){
  const sel = document.getElementById(id);
  values.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o); });
}

function getFilters(){
  return {
    channel: document.getElementById('f-channel').value,
    l1: document.getElementById('f-l1').value,
    cat: document.getElementById('f-cat').value,
    m1: document.getElementById('f-m1').value,
    m2: document.getElementById('f-m2').value,
    m3: document.getElementById('f-m3').value,
  };
}
function salesMatches(row, f){
  if (f.channel !== 'ALL' && row.channel !== f.channel) return false;
  if (f.l1 !== 'ALL' && row.l1 !== f.l1) return false;
  if (f.cat !== 'ALL' && row.cat !== f.cat) return false;
  if (f.m1 !== 'ALL' && row.m1 !== f.m1) return false;
  if (f.m2 !== 'ALL' && row.m2 !== f.m2) return false;
  if (f.m3 !== 'ALL' && row.m3 !== f.m3) return false;
  return true;
}
function leafMatches(leafRec, f){
  if (f.l1 !== 'ALL' && leafRec.l1 !== f.l1) return false;
  if (f.cat !== 'ALL' && leafRec.cat !== f.cat) return false;
  if (f.m1 !== 'ALL' && leafRec.m1 !== f.m1) return false;
  if (f.m2 !== 'ALL' && leafRec.m2 !== f.m2) return false;
  if (f.m3 !== 'ALL' && leafRec.m3 !== f.m3) return false;
  return true;
}

function fmtNum(n){
  if (n === null || n === undefined) return null;
  const abs = Math.abs(n);
  if (abs >= 1e7) return (n/1e7).toFixed(2)+'Cr';
  if (abs >= 1e5) return (n/1e5).toFixed(2)+'L';
  if (abs >= 1e3) return (n/1e3).toFixed(1)+'K';
  return Math.round(n).toLocaleString();
}

// ---- Closing/Opening: latest dated snapshot within a month, per leaf ----
function closingForLeaf(leafKey, monthKey, qtyField, valField){
  const recs = leafIndex[leafKey];
  if (!recs) return null;
  let best = null;
  for (const r of recs){ if (r.date.slice(0,7) === monthKey) best = r; }
  if (!best) return null;
  return { qty: best[qtyField] || 0, value: best[valField] || 0 };
}
function invFieldsForChannel(channel){
  if (channel === 'ALL') return { qtyField: 'total_qty', valField: 'total_value' };
  const key = CHANNEL_TO_INV_FIELD[channel];
  return key ? { qtyField: key + '_qty', valField: key + '_value' } : { qtyField: 'total_qty', valField: 'total_value' };
}

// "Current Inv" proration weight -- the latest available snapshot for a leaf,
// full stop, not bound to a specific month. Stands in for the static snapshot
// number the original sheet used to split a Category target across Metas.
function currentInvForLeaf(leafKey, qtyField, valField){
  const recs = leafIndex[leafKey];
  if (!recs || !recs.length) return 0;
  const latest = recs[recs.length - 1];
  return metric === 'qty' ? (latest[qtyField] || 0) : (latest[valField] || 0);
}

function inwardsForLeaf(leafKey, month){
  const recs = pipelineIndex[leafKey];
  if (!recs) return 0;
  const cur = currentMonthKey();
  const field = metric === 'qty' ? 'qty' : 'cogs_value';
  let sum = 0;
  if (month < cur){
    sum = 0;
  } else if (month === cur){
    const window = [month, monthMinus(month,1), monthMinus(month,2)];
    recs.forEach(r => { if (r.fdd_month && window.includes(r.fdd_month)) sum += r[field]; });
  } else {
    recs.forEach(r => { if (r.fdd_month === month) sum += r[field]; });
  }
  if (month === LAST_MONTH){
    recs.forEach(r => { if (!r.fdd_month) sum += r[field]; });
  }
  return sum;
}

// ---- Target: new-file primary, OG-tab fallback (Shopify only), then proration ----
function targetLCFromNewSource(channelFilter, l1, cat, month){
  let sum = null;
  (DATA.targets || []).forEach(r => {
    if (r.l1 !== l1 || r.cat !== cat || r.month !== month) return;
    if (channelFilter !== 'ALL' && r.channel !== channelFilter) return;
    sum = (sum || 0) + r.qty;
  });
  return sum;
}
function targetLCFromOG(l1, cat, month){
  let sum = null;
  (DATA.targets_og || []).forEach(r => {
    if (r.l1 === l1 && r.cat === cat && r.month === month){ sum = (sum||0) + r.qty; }
  });
  return sum;
}
function targetLC(channelFilter, l1, cat, month){
  if (NEW_FILE_CATS.has(cat)){
    return targetLCFromNewSource(channelFilter, l1, cat, month);
  }
  if (channelFilter === 'ALL' || channelFilter === 'Shopify'){
    return targetLCFromOG(l1, cat, month);
  }
  return null; // OG fallback is Shopify-only, no data for other channels on uncovered categories
}

// Target for an arbitrary set of leaves (already filtered to the current card-group +
// active filters), prorated per L1xCat bucket using each leaf's CurrentInv share.
function targetForLeafSet(leafKeySet, channelFilter, month, qtyField, valField){
  const byLC = {};
  leafKeySet.forEach(lk => {
    const rec = (leafIndex[lk] || pipelineIndex[lk])[0];
    const key = rec.l1 + '||' + rec.cat;
    (byLC[key] = byLC[key] || []).push(lk);
  });
  let total = null;
  Object.entries(byLC).forEach(([key, leavesInGroup]) => {
    const [l1, cat] = key.split('||');
    const tLC = targetLC(channelFilter, l1, cat, month);
    if (tLC === null) return;
    const invGroup = leavesInGroup.reduce((a,lk) => a + currentInvForLeaf(lk, qtyField, valField), 0);
    const allLeaves = allLeafKeysByLC[key] || [];
    const invTotal = allLeaves.reduce((a,lk) => a + currentInvForLeaf(lk, qtyField, valField), 0);
    if (invTotal === 0) return;
    total = (total || 0) + tLC * (invGroup / invTotal);
  });
  return total;
}

function doiClass(doi){
  if (doi === null || doi === undefined) return 'doi-none';
  if (doi <= 45) return 'doi-healthy';
  if (doi > 90) return 'doi-stuck';
  return 'doi-watch';
}

function sumSales(rows, field){ return rows.reduce((a,r) => a + (r[field]||0), 0); }
function groupKeyOf(row, dims){ return dims.map(d => row[d] ?? '∅').join(' | '); }

function render(){
  const f = getFilters();
  document.getElementById('active-path').textContent =
    'Filter: ' + ([f.channel, f.l1, f.cat, f.m1, f.m2, f.m3].filter(v => v !== 'ALL').join(' → ') || 'All data');

  const sales = DATA.sales.filter(r => salesMatches(r, f));
  const { qtyField, valField } = invFieldsForChannel(f.channel);
  const allLeafKeys = new Set([...Object.keys(leafIndex), ...Object.keys(pipelineIndex)]);
  const leafKeysMatchingFilter = [...allLeafKeys].filter(k => {
    const recs = leafIndex[k] || pipelineIndex[k];
    return recs.length && leafMatches(recs[0], f);
  });

  renderKPIs(sales, leafKeysMatchingFilter, qtyField, valField, f);
  if (currentPage === 'dashboard'){
    renderCards(sales, leafKeysMatchingFilter, f, qtyField, valField);
  } else if (currentPage === 'tracking'){
    renderTracking(sales, leafKeysMatchingFilter, f, qtyField, valField);
  } else {
    renderExecSummary();
  }
}

// fraction of a month elapsed, for the till-date pace check: 1 for fully-past
// months, 0 for not-yet-started months, (today's day / days in month) for
// the current month.
function monthFraction(monthKey){
  const cur = currentMonthKey();
  if (monthKey < cur) return 1;
  if (monthKey > cur) return 0;
  const now = new Date();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  return now.getDate() / daysInMonth;
}

function computeTrackingLedger(entity, f, qtyField, valField){
  const valKey = metric === 'qty' ? 'qty' : 'cogs_sold';
  const target = [], actual = [], tillDateTarget = [], delta = [];
  MONTHS.forEach(m => {
    const t = targetForLeafSet(entity.leafKeys, f.channel, m, qtyField, valField);
    const matched = entity.salesRows.filter(x => x.month === m);
    const a = matched.length ? sumSales(matched, valKey) : 0;
    target.push(t);
    actual.push(a);
    if (t === null){
      tillDateTarget.push(null);
      delta.push(null);
    } else {
      const tdt = t * monthFraction(m);
      tillDateTarget.push(tdt);
      delta.push(tdt - a);
    }
  });
  return { target, actual, tillDateTarget, delta };
}

function deltaCell(v){
  if (v === null || v === undefined) return `<td class="dash">—</td>`;
  const cls = v > 0 ? 'delta-behind' : (v < 0 ? 'delta-ahead' : '');
  return `<td class="${cls}">${v>0?'+':''}${fmtNum(v)}</td>`;
}

function renderTracking(sales, leafKeys, f, qtyField, valField){
  const root = document.getElementById('tracking-root');
  root.innerHTML = '';
  CARD_DEFS.forEach(def => {
    root.appendChild(renderBreakdownSection(def, sales, leafKeys, f, qtyField, valField, 'track_', computeTrackingLedger, TRACKING_BLOCKS));
  });
}

// Sequential simulation shared by KPIs and the pivot cards, strictly in month
// order -- Closing(m) feeds Opening(m+1) whenever month m+1 has no real snapshot
// of its own (i.e. every month except the current one, in practice).
//   Opening(m)    = real snapshot within m, if one exists; else Closing(m-1)
//   Sales Left(m) = MAX(0, Target(m) - Actual(m))
//   Closing(m)    = Opening(m) + Inwards(m) - Sales Left(m)
function computeLedger(entity, f, qtyField, valField){
  const valKey = metric === 'qty' ? 'qty' : 'cogs_sold';
  function realSnapshotAt(m){
    let sum = null;
    entity.leafKeys.forEach(lk => {
      const c = closingForLeaf(lk, m, qtyField, valField);
      if (c !== null) sum = (sum||0) + (metric==='qty' ? c.qty : c.value);
    });
    return sum;
  }
  function actualAt(m){
    const matched = entity.salesRows.filter(x => x.month === m);
    return matched.length ? sumSales(matched, valKey) : 0;
  }
  function targetAt(m){ return targetForLeafSet(entity.leafKeys, f.channel, m, qtyField, valField); }
  function inwardsAt(m){ return entity.leafKeys.reduce((a,lk) => a + inwardsForLeaf(lk, m), 0); }

  const opening = [], closing = [], salesLeft = [], target = [], actual = [], inwards = [];
  for (let i = 0; i < MONTHS.length; i++){
    const m = MONTHS[i];
    target.push(targetAt(m));
    actual.push(actualAt(m));
    inwards.push(inwardsAt(m));

    const real = realSnapshotAt(m);
    const openVal = real !== null ? real : (i > 0 ? closing[i-1] : null);
    opening.push(openVal);

    const tgt = target[i];
    const slVal = tgt !== null ? Math.max(0, tgt - actual[i]) : null;
    salesLeft.push(slVal);

    const closeVal = (openVal !== null && slVal !== null) ? (openVal + inwards[i] - slVal) : null;
    closing.push(closeVal);
  }
  return { opening, closing, salesLeft, target, actual, inwards };
}

function renderKPIs(sales, leafKeys, qtyField, valField, f){
  const salesQty = sumSales(sales, 'qty');
  const salesCogs = sumSales(sales, 'cogs_sold');
  const salesGross = sumSales(sales, 'gross_sales');

  const ledger = computeLedger({ leafKeys, salesRows: sales }, f, qtyField, valField);
  const totalTarget = ledger.target.reduce((a,v) => v!==null ? a+v : a, 0);
  const anyTarget = ledger.target.some(v => v !== null);
  const attain = (anyTarget && totalTarget) ? (salesQty / totalTarget * 100) : null;

  let lastMonthIdx = -1;
  for (let i = 0; i < MONTHS.length; i++){ if (ledger.closing[i] !== null) lastMonthIdx = i; }
  const closingQty = lastMonthIdx >= 0 ? ledger.closing[lastMonthIdx] : null;
  const targetAtLastMonth = lastMonthIdx >= 0 ? ledger.target[lastMonthIdx] : null;
  const doi = (closingQty !== null && targetAtLastMonth) ? (closingQty * 30 / targetAtLastMonth) : null;
  const gm = salesGross ? ((salesGross - salesCogs) / salesGross * 100) : null;

  const kpis = [
    {label:'Sales Qty (Aug–Dec)', value: fmtNum(salesQty), sub: sales.length+' line items'},
    {label:'Sales COGS Value', value: '₹'+fmtNum(salesCogs), sub: 'gross ₹'+fmtNum(salesGross)},
    {label:'Target Attainment', value: attain!==null ? attain.toFixed(1)+'%' : '—',
     sub: anyTarget ? fmtNum(totalTarget)+' units target' : 'no target for this slice yet'},
    {label:'Closing (simulated)', value: closingQty!==null ? fmtNum(closingQty)+' u' : '—', sub: lastMonthIdx>=0 ? 'as of '+MONTH_LABEL[MONTHS[lastMonthIdx]] : 'no data yet'},
    {label:'DOI (Closing/Target×30)', value: doi!==null ? doi.toFixed(0)+'d' : '—', sub: gm!==null ? 'GM '+gm.toFixed(1)+'%' : ''},
  ];
  document.getElementById('kpi-row').innerHTML = kpis.map(k =>
    `<div class="kpi"><div class="label">${k.label}</div><div class="value">${k.value}</div><div class="sub">${k.sub}</div></div>`
  ).join('');
}

let sortState = {}; // cardId -> {mode:'meta', key, dir} | {mode:'value', blockKey, monthIndex, dir}
const DIM_LABELS = {l1:'L1', cat:'Category', m1:'Meta1', m2:'Meta2', m3:'Meta3'};

const DASHBOARD_BLOCKS = [
  {key:'opening', title:'Opening'},
  {key:'actual', title:'Sales (Actual)'},
  {key:'target', title:'Sales Target', note:true},
  {key:'salesLeft', title:'Sales Left', note:true},
  {key:'inwards', title:'Inwards'},
  {key:'closing', title:'Closing (simulated)'},
  {key:'doi', title:'DOI (Closing/Target×30)', note:true, isDoi:true},
];
const TRACKING_BLOCKS = [
  {key:'target', title:'Sales Target (Full Month)', note:true},
  {key:'tillDateTarget', title:'Sales Target (Till-Date)', note:true},
  {key:'actual', title:'Sales (Actual)'},
  {key:'delta', title:'Sales Left to Achieve (Till-Date)', note:true, isDelta:true},
];

function buildEntities(def, sales, leafKeys){
  const entities = {};
  sales.forEach(r => {
    if (def.dims.every(d => r[d] == null)) return;
    const gk = groupKeyOf(r, def.dims);
    if (!entities[gk]){
      const values = {}; def.dims.forEach(d => values[d] = r[d] ?? '(none)');
      entities[gk] = { values, salesRows: [], leafKeys: [] };
    }
    entities[gk].salesRows.push(r);
  });
  leafKeys.forEach(lk => {
    const rec = (leafIndex[lk] || pipelineIndex[lk])[0];
    if (def.dims.every(d => rec[d] == null)) return;
    const gk = def.dims.map(d => rec[d] ?? '∅').join(' | ');
    if (!entities[gk]){
      const values = {}; def.dims.forEach(d => values[d] = rec[d] ?? '(none)');
      entities[gk] = { values, salesRows: [], leafKeys: [] };
    }
    entities[gk].leafKeys.push(lk);
  });
  return Object.values(entities);
}

function lastAvailableDoi(ledger){
  for (let i = ledger.closing.length - 1; i >= 0; i--){
    if (ledger.closing[i] !== null && ledger.target[i]) return ledger.closing[i] * 30 / ledger.target[i];
  }
  return null;
}

function sortEntities(rows, ledgers, spec, def){
  const rowsCopy = rows.slice();
  if (spec.mode === 'meta' && spec.key === 'sales'){
    rowsCopy.sort((a,b) => {
      const sa = sumSales(a.salesRows,'gross_sales'), sb = sumSales(b.salesRows,'gross_sales');
      return spec.dir === 'asc' ? sa - sb : sb - sa;
    });
  } else if (spec.mode === 'meta' && spec.key === 'az'){
    rowsCopy.sort((a,b) => {
      const la = def.dims.map(d=>a.values[d]).join(' ');
      const lb = def.dims.map(d=>b.values[d]).join(' ');
      return la.localeCompare(lb);
    });
  } else if (spec.mode === 'meta' && spec.key === 'doi'){
    rowsCopy.sort((a,b) => {
      const da = lastAvailableDoi(ledgers.get(a)), db = lastAvailableDoi(ledgers.get(b));
      if (da===null && db===null) return 0;
      if (da===null) return 1;
      if (db===null) return -1;
      return spec.dir==='asc' ? da-db : db-da;
    });
  } else if (spec.mode === 'value'){
    rowsCopy.sort((a,b) => {
      const va = ledgers.get(a)[spec.blockKey][spec.monthIndex];
      const vb = ledgers.get(b)[spec.blockKey][spec.monthIndex];
      const na = va===null||va===undefined, nb = vb===null||vb===undefined;
      if (na && nb) return 0;
      if (na) return 1;
      if (nb) return -1;
      return spec.dir==='asc' ? va-vb : vb-va;
    });
  }
  return rowsCopy;
}

function renderCellForBlock(blockDef, ledger, i){
  if (blockDef.isDoi){
    const c = ledger.closing[i], t = ledger.target[i];
    if (c===null || !t) return `<td class="doi-cell"><span class="doi-chip doi-none">—</span></td>`;
    const doi = c*30/t;
    return `<td class="doi-cell"><span class="doi-chip ${doiClass(doi)}">${doi.toFixed(0)}d</span></td>`;
  }
  const v = ledger[blockDef.key][i];
  if (blockDef.isDelta){
    if (v===null||v===undefined) return `<td class="dash">—</td>`;
    const cls = v>0?'delta-behind':(v<0?'delta-ahead':'');
    return `<td class="${cls}">${v>0?'+':''}${fmtNum(v)}</td>`;
  }
  return (v===null||v===undefined) ? `<td class="dash">—</td>` : `<td>${fmtNum(v)}</td>`;
}

function computeTotal(rows, ledgers, blockDef, monthIndex){
  if (blockDef.isDoi){
    let closingSum = 0, targetSum = 0, any = false;
    rows.forEach(r => {
      const l = ledgers.get(r);
      if (l.closing[monthIndex] !== null){ closingSum += l.closing[monthIndex]; any = true; }
      if (l.target[monthIndex] !== null){ targetSum += l.target[monthIndex]; }
    });
    if (!any || !targetSum) return null;
    return closingSum * 30 / targetSum;
  }
  let sum = null;
  rows.forEach(r => {
    const v = ledgers.get(r)[blockDef.key][monthIndex];
    if (v !== null && v !== undefined) sum = (sum||0) + v;
  });
  return sum;
}

function pivotBlockV2(blockDef, rows, def, ledgers, cardId, sortSpec){
  const dimHeaders = def.dims.map(d => `<th>${DIM_LABELS[d]}</th>`).join('');
  const monthHeaders = MONTHS.map((m,i) => {
    const isActive = sortSpec.mode==='value' && sortSpec.blockKey===blockDef.key && sortSpec.monthIndex===i;
    const arrow = isActive ? (sortSpec.dir==='asc' ? ' ▲' : ' ▼') : '';
    return `<th class="sortable-th" data-card="${cardId}" data-block="${blockDef.key}" data-month="${i}">${MONTH_LABEL[m]}${arrow}</th>`;
  }).join('');

  const rowsHtml = rows.map(r => {
    const dimCells = def.dims.map(d => `<td class="rowlabel">${r.values[d]}</td>`).join('');
    const cells = MONTHS.map((m,i) => renderCellForBlock(blockDef, ledgers.get(r), i)).join('');
    return `<tr>${dimCells}${cells}</tr>`;
  }).join('');

  const totalDimCells = def.dims.map((d,i) => i===0 ? `<td class="rowlabel total-label">TOTAL</td>` : `<td class="rowlabel"></td>`).join('');
  const totalCells = MONTHS.map((m,i) => {
    const t = computeTotal(rows, ledgers, blockDef, i);
    if (t === null || t === undefined) return `<td class="dash">—</td>`;
    if (blockDef.isDoi) return `<td><span class="doi-chip ${doiClass(t)}">${t.toFixed(0)}d</span></td>`;
    if (blockDef.isDelta){
      const cls = t>0?'delta-behind':(t<0?'delta-ahead':'');
      return `<td class="${cls}">${t>0?'+':''}${fmtNum(t)}</td>`;
    }
    return `<td>${fmtNum(t)}</td>`;
  }).join('');

  return `
    <div class="pivot-block">
      <h4 class="${blockDef.note ? 'target-note' : ''}">${blockDef.title}</h4>
      <table class="ptable">
        <thead><tr>${dimHeaders}${monthHeaders}</tr></thead>
        <tbody>${rowsHtml}</tbody>
        <tfoot><tr class="total-row">${totalDimCells}${totalCells}</tr></tfoot>
      </table>
    </div>`;
}

function renderBreakdownSection(def, sales, leafKeys, f, qtyField, valField, cardIdPrefix, ledgerFn, blockDefs){
  const cardId = cardIdPrefix + def.id;
  const rowsRaw = buildEntities(def, sales, leafKeys);
  const ledgers = new Map();
  rowsRaw.forEach(r => ledgers.set(r, ledgerFn(r, f, qtyField, valField)));

  const spec = sortState[cardId] || {mode:'meta', key:'sales', dir:'desc'};
  const rows = sortEntities(rowsRaw, ledgers, spec, def);

  const hasDoiBlock = blockDefs.some(b => b.isDoi);
  const section = document.createElement('div');
  section.className = 'card-section';
  section.innerHTML = `
    <h2>${def.title} <span class="rule"></span>
      <span class="count">${rows.length} shown</span>
      <select class="sort-select" data-card="${cardId}">
        <option value="sales_desc">Sales (high→low)</option>
        <option value="sales_asc">Sales (low→high)</option>
        <option value="az">A→Z</option>
        ${hasDoiBlock ? '<option value="doi_desc">DOI (stuck first)</option><option value="doi_asc">DOI (healthy first)</option>' : ''}
      </select>
      <span class="sort-hint">or click any column header to sort by that value</span>
    </h2>`;
  const sel = section.querySelector('.sort-select');
  if (spec.mode === 'meta') sel.value = spec.key === 'az' ? 'az' : `${spec.key}_${spec.dir}`;
  sel.addEventListener('change', (e) => {
    const [key, dir] = e.target.value === 'az' ? ['az','asc'] : e.target.value.split('_');
    sortState[cardId] = { mode:'meta', key, dir };
    render();
  });

  if (rows.length === 0){
    const p = document.createElement('div');
    p.className = 'empty-note';
    p.textContent = 'No rows match the current filter at this level.';
    section.appendChild(p);
  } else {
    const strip = document.createElement('div');
    strip.className = 'pivot-strip';
    strip.innerHTML = blockDefs.map(bd => pivotBlockV2(bd, rows, def, ledgers, cardId, spec)).join('');
    section.appendChild(strip);

    strip.querySelectorAll('.sortable-th').forEach(th => {
      th.addEventListener('click', () => {
        const blockKey = th.dataset.block;
        const monthIndex = parseInt(th.dataset.month, 10);
        const cur = sortState[cardId];
        let dir = 'desc';
        if (cur && cur.mode==='value' && cur.blockKey===blockKey && cur.monthIndex===monthIndex){
          dir = cur.dir === 'desc' ? 'asc' : 'desc';
        }
        sortState[cardId] = { mode:'value', blockKey, monthIndex, dir };
        render();
      });
    });
  }
  return section;
}

function renderCards(sales, leafKeys, f, qtyField, valField){
  const root = document.getElementById('cards-root');
  root.innerHTML = '';
  CARD_DEFS.forEach(def => {
    root.appendChild(renderBreakdownSection(def, sales, leafKeys, f, qtyField, valField, '', computeLedger, DASHBOARD_BLOCKS));
  });
}

// Executive Summary: always computed at the WHOLE-BUSINESS level (ignores active
// filters deliberately) so it reads as a stable, consistent narrative regardless
// of whatever slice someone happens to have selected on the other tabs.
function renderExecSummary(){
  const root = document.getElementById('summary-root');
  root.innerHTML = '';

  const qtyField = 'total_qty', valField = 'total_value';
  const allLeafKeys = Object.keys(leafIndex);
  const rootEntity = { salesRows: DATA.sales, leafKeys: allLeafKeys };
  const globalLedger = computeLedger(rootEntity, {channel:'ALL'}, qtyField, valField);

  const catDef = CARD_DEFS.find(d => d.id === 'cat');
  const catRows = buildEntities(catDef, DATA.sales, allLeafKeys);
  const catLedgers = new Map();
  catRows.forEach(r => catLedgers.set(r, computeLedger(r, {channel:'ALL'}, qtyField, valField)));

  MONTHS.forEach((m,i) => {
    const actual = globalLedger.actual[i];
    const target = globalLedger.target[i];
    const attain = target ? (actual/target*100) : null;
    const closing = globalLedger.closing[i];
    const doi = (closing!==null && target) ? closing*30/target : null;

    const topCats = catRows.slice()
      .sort((a,b) => (catLedgers.get(b).actual[i]||0) - (catLedgers.get(a).actual[i]||0))
      .slice(0,3)
      .map(r => `${r.values.cat} (${fmtNum(catLedgers.get(r).actual[i]||0)})`);
    const anyActual = catRows.some(r => (catLedgers.get(r).actual[i]||0) > 0);

    const riskCats = catRows.filter(r => {
      const c = catLedgers.get(r).closing[i];
      return c !== null && c < 0;
    }).map(r => r.values.cat);

    const slowCats = catRows
      .filter(r => { const l = catLedgers.get(r); return l.closing[i]!==null && l.target[i]; })
      .sort((a,b) => {
        const la = catLedgers.get(a), lb = catLedgers.get(b);
        return (lb.closing[i]*30/lb.target[i]) - (la.closing[i]*30/la.target[i]);
      })
      .slice(0,2)
      .map(r => {
        const l = catLedgers.get(r);
        return `${r.values.cat} (${(l.closing[i]*30/l.target[i]).toFixed(0)}d)`;
      });

    const card = document.createElement('div');
    card.className = 'summary-card';
    card.innerHTML = `
      <h3>${MONTH_LABEL[m]} 2026</h3>
      <div class="summary-stats">
        <span>Sales <b>${fmtNum(actual)}</b> vs Target <b>${target?fmtNum(target):'—'}</b> &nbsp;(${attain!==null?attain.toFixed(1)+'% attainment':'no target'})</span>
        <span>Closing (simulated) <b>${closing!==null?fmtNum(closing):'—'}</b> &middot; Blended DOI <b>${doi!==null?doi.toFixed(0)+'d':'—'}</b></span>
      </div>
      <ul class="summary-list">
        <li><b>Top categories by sales:</b> ${anyActual ? topCats.join(', ') : 'No actual sales recorded yet for this month'}</li>
        <li><b>Stock-out risk (simulated closing goes negative):</b> ${riskCats.length ? riskCats.join(', ') : 'None flagged'}</li>
        <li><b>Slowest movers (highest DOI):</b> ${slowCats.join(', ') || '—'}</li>
      </ul>`;
    root.appendChild(card);
  });

  const note = document.createElement('div');
  note.className = 'empty-note';
  note.textContent = 'This summary always reflects the whole business (Qty basis, all channels) regardless of filters set on the other tabs.';
  root.appendChild(note);
}
